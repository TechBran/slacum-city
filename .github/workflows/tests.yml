name: Sim tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.2-stable-linux

      - name: Install Godot 4.7.2
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -oq godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Generated data is in sync with its generators
        run: |
          python3 tools/gen_buildings.py --check
          python3 tools/gen_building_economy.py --check
          python3 tools/gen_starter_city.py --check

      - name: Import project (registers class_name scripts)
        run: ~/godot/godot --headless --path . --import || true

      - name: Run headless sim tests
        run: ~/godot/godot --headless --path . -s res://tests/run_tests.gd
